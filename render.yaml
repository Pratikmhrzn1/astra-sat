services:
  - type: web
    name: sat-prep-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set in Render dashboard — paste Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # set in Render dashboard — your Cloudflare Pages URL
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false   # set in Render dashboard — get key from openrouter.ai
      - key: AI_MODEL_FEEDBACK
        value: anthropic/claude-haiku-4.5
      - key: AI_MODEL_NARRATIVE
        value: anthropic/claude-sonnet-4.6
      - key: AI_MODEL_CLASSIFY
        value: anthropic/claude-sonnet-4.6
