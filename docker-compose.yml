services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sat}
      POSTGRES_USER: ${POSTGRES_USER:-sat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sat_user} -d ${POSTGRES_DB:-sat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sat_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sat}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL_FEEDBACK: ${AI_MODEL_FEEDBACK:-}
      AI_MODEL_NARRATIVE: ${AI_MODEL_NARRATIVE:-}
      AI_MODEL_CLASSIFY: ${AI_MODEL_CLASSIFY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
